name: travel-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travel}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_MODE: ${AI_MODE:-demo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      PORT: '3000'
      TRUST_PROXY_HOPS: '1'
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
    restart: unless-stopped
    logging: *logging
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
